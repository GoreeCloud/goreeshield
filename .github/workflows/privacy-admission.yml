name: GoreeShield protected-main admission

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Validate baseline and source admission
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/promotion-gates.md
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          if (( ${#go_files[@]} > 0 )); then
            test -f go.mod || { echo "Go source without a module is not admitted" >&2; exit 1; }
          elif test -f go.mod; then
            echo "Go module exists but contains no tracked Go source" >&2
            exit 1
          fi
          if test -f go.mod; then
            test -z "$(gofmt -l "${go_files[@]}")"
            go test -race ./...
            go vet ./...
            go build ./...
          else
            echo "PASS: documentation-only foundation; no Go implementation claims"
          fi
