name: Linux prototype checks

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "planning/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Inspect Go formatting differences
        run: gofmt -d ./cmd ./internal
      - name: Verify committed Go formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Unit and integration tests (race detector)
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Native Linux build
        run: GOOS=linux GOARCH=amd64 go build ./cmd/...
